services:
  app:
    build: .
    image: mybas-app:latest
    container_name: mybas-app
    restart: unless-stopped
    working_dir: /var/www/html
    user: "1000:1000"
    env_file:
      - ./.env
    environment:
      - DB_HOST=host.docker.internal
      - PME_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/var/www/html/storage
      - ./public:/var/www/html/public
      - ./docker/php-fpm/www.conf:/usr/local/etc/php-fpm.d/zz-mybas.conf:ro
    networks:
      - mybas
    expose:
      - "9000"

  queue:
    image: mybas-app:latest
    container_name: mybas-queue
    restart: unless-stopped
    working_dir: /var/www/html
    user: "1000:1000"
    command: |
      sh -c 'trap "kill 0" SIGTERM SIGINT EXIT; \
        php artisan queue:work database --tries=3 --timeout=90 --sleep=1 & \
        php artisan queue:work database --tries=3 --timeout=90 --sleep=1 & \
        wait'
    env_file:
      - ./.env
    environment:
      - DB_HOST=host.docker.internal
      - PME_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/var/www/html/storage
      - ./public:/var/www/html/public
    depends_on:
      - app
    networks:
      - mybas

  nginx:
    image: nginx:1.25-alpine
    container_name: mybas-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - mybas

networks:
  mybas:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.1.0/24
